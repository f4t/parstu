<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Pars-tu ? · Covoiturage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <!-- Barre de progression globale (fetch lent Apps Script) -->
  <div id="loadbar" class="hidden" aria-hidden="true"><div></div></div>

  <!-- Carte plein écran -->
  <div id="map" class="fixed inset-0 z-0"></div>

  <!-- Bandeau haut -->
  <header class="fixed top-3 left-3 right-3 z-[450] pointer-events-none">
    <div class="bg-white rounded-full shadow-lg px-4 py-2 flex items-center gap-2 max-w-md pointer-events-auto">
      <span class="text-lg leading-none">🚗</span>
      <span id="siteTitle" class="font-bold leading-tight">Pars-tu&nbsp;?</span>
      <span id="eventName" class="text-sm text-slate-500 truncate"></span>
    </div>
  </header>

  <!-- Bottom sheet -->
  <section id="sheet" class="fixed inset-x-0 bottom-0 z-[450] bg-white rounded-t-2xl shadow-2xl flex flex-col max-w-3xl mx-auto">
    <button id="sheetToggle" aria-label="Agrandir" class="mx-auto mt-1.5 p-1 text-slate-400 leading-none">
      <svg id="chevron" class="w-6 h-6 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
    </button>
    <div class="px-4 pb-2">
      <h2 id="sheetTitle" class="text-xl font-bold leading-tight"></h2>
      <p id="sheetPlace" class="text-sm text-slate-500 mt-0.5"></p>
      <p id="sheetDate" class="text-sm text-slate-500"></p>
    </div>
    <nav class="px-4 pb-2">
      <div class="flex gap-1 bg-slate-100 rounded-lg p-1 text-sm">
        <button data-tab="trajets" class="tab flex-1 py-1.5 rounded-md font-medium">Trajets</button>
        <button data-tab="attente" class="tab flex-1 py-1.5 rounded-md font-medium">Attente</button>
        <button data-tab="infos" class="tab flex-1 py-1.5 rounded-md font-medium">Infos</button>
      </div>
    </nav>
    <div id="sheetBody" class="overflow-y-auto px-4 pb-6 space-y-3">
      <div id="tabTrips"></div>
      <div id="tabAttente" class="hidden"></div>
      <div id="tabInfos" class="hidden"></div>
    </div>
  </section>

  <!-- Modale (form trajet / form attente) -->
  <div id="modal" class="fixed inset-0 z-[700] hidden bg-black/40 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl p-4 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h3 id="modalTitle" class="font-bold text-lg"></h3>
        <button id="modalClose" class="text-slate-400 text-2xl leading-none" aria-label="Fermer">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
