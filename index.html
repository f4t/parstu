<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1c1c" />
  <title>Pars-tu ? · Covoiturage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="antialiased">

  <!-- Barre de titre style Winamp -->
  <header class="wa-titlebar sticky top-0 z-[500]">
    <div class="max-w-3xl mx-auto px-4 pt-2 pb-1">
      <div class="flex items-center justify-between">
        <h1 id="siteTitle" class="text-2xl leading-none">Pars-tu&nbsp;? 🚗</h1>
        <span class="wa-winbtns" aria-hidden="true">▂ ▢ ✕</span>
      </div>
      <div class="flex items-center justify-between gap-3 mt-1">
        <span class="wa-tagline">— ça déménage du llama</span>
        <div id="counter" class="wa-led">TRAJETS · 000</div>
      </div>
      <div class="wa-grabber mt-2"></div>
    </div>
  </header>

  <!-- Onglets -->
  <nav class="max-w-3xl mx-auto px-4 pt-3 flex gap-2">
    <button data-tab="offres" class="wa-tab is-active flex-1">Offres</button>
    <button data-tab="demandes" class="wa-tab flex-1">Demandes</button>
    <button data-tab="publier" class="wa-tab flex-1">+ Publier</button>
    <button id="toggleMap" class="wa-btn px-3" title="Afficher la carte">▣</button>
  </nav>

  <!-- Filtres -->
  <section id="filters" class="max-w-3xl mx-auto px-4 pt-3 grid grid-cols-2 gap-2">
    <input id="fOrigin" class="wa-input col-span-2 sm:col-span-1 px-3" placeholder="Origine" />
    <input id="fDest" class="wa-input col-span-2 sm:col-span-1 px-3" placeholder="Destination" />
    <input id="fDate" type="date" class="wa-input col-span-2 px-3" />
  </section>

  <!-- Carte -->
  <section id="mapWrap" class="max-w-3xl mx-auto px-4 pt-3 hidden">
    <div class="wa-panel p-1">
      <div id="map" class="h-72 w-full z-0"></div>
    </div>
  </section>

  <!-- Liste -->
  <main id="list" class="max-w-3xl mx-auto px-4 py-4 space-y-3"></main>

  <!-- Formulaire publier -->
  <section id="formWrap" class="max-w-3xl mx-auto px-4 py-4 hidden">
    <form id="rideForm" class="wa-panel p-4 space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <label class="flex items-center gap-2 text-lg"><input type="radio" name="type" value="offre" checked /> J'offre</label>
        <label class="flex items-center gap-2 text-lg"><input type="radio" name="type" value="demande" /> Je cherche</label>
      </div>
      <input name="nom" required maxlength="60" class="wa-input w-full px-3" placeholder="Ton prénom / nom" />
      <input name="contact" required maxlength="80" class="wa-input w-full px-3" placeholder="Téléphone ou email (affiché publiquement)" />

      <div class="geo relative">
        <input name="depart_txt" required autocomplete="off" class="wa-input w-full px-3" placeholder="Départ (ville / adresse)" />
        <input type="hidden" name="depart_lat" /><input type="hidden" name="depart_lng" />
        <ul class="geo-suggest hidden absolute z-[600] w-full mt-1 max-h-48 overflow-auto"></ul>
      </div>
      <div class="geo relative">
        <input name="arrivee_txt" required autocomplete="off" class="wa-input w-full px-3" placeholder="Arrivée (ville / adresse)" />
        <input type="hidden" name="arrivee_lat" /><input type="hidden" name="arrivee_lng" />
        <ul class="geo-suggest hidden absolute z-[600] w-full mt-1 max-h-48 overflow-auto"></ul>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <input name="date" type="date" class="wa-input px-3" />
        <input name="heure" type="time" class="wa-input px-3" />
      </div>
      <input name="places" type="number" min="1" max="9" class="wa-input w-full px-3" placeholder="Places (conducteur)" />
      <textarea name="commentaire" maxlength="280" rows="2" class="wa-input w-full px-3" placeholder="Commentaire (optionnel) : bagages, fumeur, animaux…"></textarea>

      <!-- honeypot anti-bot, caché -->
      <input name="website" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true" />

      <button type="submit" class="wa-btn wa-btn--primary w-full font-semibold py-2.5 text-xl">Publier</button>
      <p id="formMsg" class="text-center"></p>
    </form>
  </section>

  <footer class="max-w-3xl mx-auto px-4 py-6 text-center text-xs" style="color:var(--cream-dim)">
    Pars-tu&nbsp;? · site temporaire · données publiques · contact affiché en clair
  </footer>

  <script src="app.js"></script>
</body>
</html>
